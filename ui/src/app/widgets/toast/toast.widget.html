<div class="toast-container position-fixed top-0 end-0 p-3">
  <div class="toast" [ngClass]="show()" role="alert" aria-live="assertive" aria-atomic="true">
    <div class="toast-header d-flex justify-content-between align-items-center">
      <div class="d-flex gap-2 align-items-center">
        <i class="bi" [ngClass]="icon()"></i>
        <strong>{{ title() }}</strong>
      </div>
      <div class="d-flex gap-2 align-items-center">
        <!-- <small>11 mins ago</small> -->
        <button type="button" class="btn-close" aria-label="Close" (click)="hide()"></button>
      </div>
    </div>
    <div class="toast-body d-flex flex-column gap-2">
      <span>{{ message() }}</span>
      @if (hasDetails()) {
        <small>{{ details() }}</small>
      }
    </div>
  </div>
</div>
