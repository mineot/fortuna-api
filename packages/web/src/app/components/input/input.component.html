<div class="app-input">
  <label [for]="inputId" class="form-label">
    <span>{{ label }}</span>
    @if (isRequired) {
      <span class="star text-warning" aria-hidden="true">*</span>
    }
  </label>

  <div class="group">
    <input
      class="form-control"
      [id]="inputId || null"
      [name]="name || null"
      [type]="inputType"
      [placeholder]="placeholder"
      [disabled]="disabled"
      [value]="value"
      (input)="handleInput($event)"
      (blur)="handleBlur()"
    />

    @if (canTogglePassword) {
      <button
        class="btn btn-sm"
        type="button"
        [attr.aria-label]="isPasswordVisible ? 'Ocultar senha' : 'Mostrar senha'"
        [disabled]="disabled"
        (click)="togglePasswordVisibility()"
      >
        <i
          class="bi"
          [class.bi-eye]="!isPasswordVisible"
          [class.bi-eye-slash]="isPasswordVisible"
        ></i>
      </button>
    }
  </div>

  <span class="messages text-warning" [class.hidden]="!showError" [class.flex]="showError">
    @for (message of errorMessages; track message) {
      <span>{{ message }}</span>
    }
  </span>
</div>
